<body>
<div id="authGate"><div class="authBox">
<h2>PokéVault</h2><p>登录你的云端卡牌资产库。手机、平板和电脑使用同一份资料。</p>
<form id="loginForm"><div class="field"><label>邮箱</label><input id="loginEmail" type="email" autocomplete="username" required></div>
<div class="field"><label>密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
<button class="btn primary" type="submit">登录 PokéVault</button><div id="authErr" class="authErr"></div></form>
</div></div>

<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="logo" id="logoBox">🎴</div><div><b>PokéVault</b><small>CARD MANAGER</small></div></div>
<div class="nav">
<button class="active" onclick="go('dashboard',this)">⌂ <span>总览 Dashboard</span></button>
<button onclick="go('holding',this)">▣ <span>目前持有</span></button>
<button onclick="go('sold',this)">↗ <span>已卖出</span></button>
</div>
<button class="sideBtn primary" onclick="openAdd()">＋ <span>新增资产</span></button>
<div class="sideTitle">搜索</div><div class="sideSearch"><span>⌕</span><input id="sideSearch" placeholder="卡名 / 编号 / 序列号..." oninput="syncSearch(this.value)"></div>
<div class="sideTitle">分类</div><div class="catList" id="catList"></div>
<button class="sideBtn" onclick="openCategory()">＋ <span>管理分类</span></button>
<div class="sideBottom"><button class="btn" onclick="exportData()">备份</button><button class="btn" onclick="document.getElementById('import').click()">恢复</button></div>
</aside>

<main class="main">
<header class="top"><div><button class="menuBtn" onclick="toggleMenu()">☰</button><h1>库存总览 <span class="cloudStatus"><i class="cloudDot"></i>云端同步</span></h1><p>Android 手机 / 平板 / 电脑</p></div>
<div class="topActions"><button class="btn desktop" onclick="exportData()">备份资料</button><button class="btn primary" onclick="openAdd()">＋ 新增资产</button><button class="btn desktop" onclick="logout()">退出</button></div></header>

<div class="content" id="dashboard">
<div class="stats">
<div class="stat"><label>总收卡成本</label><strong id="totalCost">RM 0.00</strong><small>所有资产投入</small></div>
<div class="stat"><label>已卖出金额</label><strong id="soldAmount">RM 0.00</strong><small>成交金额</small></div>
<div class="stat"><label>净收入</label><strong id="netIncome" class="positive">RM 0.00</strong><small>卖出价 − 成本 − 费用</small></div>
<div class="stat"><label>持有成本</label><strong id="holdingCost">RM 0.00</strong><small>目前库存投入</small></div>
<div class="stat"><label>库存估值</label><strong id="marketValue">RM 0.00</strong><small>当前市值</small></div>
<div class="stat"><label>未实现利润</label><strong id="unrealized">RM 0.00</strong><small>估值 − 持有成本</small></div>
</div>
<div class="cards" id="categoryCards"></div>

<div class="section" id="holding"><div class="sectionHead"><b>📦 目前持有</b><span id="holdingCount"></span></div><div class="tableWrap"><table>
<thead><tr><th>图片</th><th>名称</th><th>分类</th><th>鉴定公司</th><th>编号</th><th>Grade</th><th>序列号</th><th>收卡日期</th><th>成本</th><th>市值</th><th>持有天数</th><th>操作</th></tr></thead><tbody id="holdingBody"></tbody></table></div></div>

<div class="section" id="sold"><div class="sectionHead"><b>💰 已卖出</b><span id="soldCount"></span></div><div class="tableWrap"><table>
<thead><tr><th>图片</th><th>名称</th><th>分类</th><th>鉴定公司</th><th>收卡日期</th><th>成本</th><th>卖出日期</th><th>卖出价</th><th>费用</th><th>净收入</th><th>操作</th></tr></thead><tbody id="soldBody"></tbody></table></div></div>
</div></main>
</div>

<nav class="mobile-only-nav"><button onclick="go('dashboard',this)">⌂<br>首页</button><button onclick="go('holding',this)">▣<br>库存</button><button class="add" onclick="openAdd()">＋<br>新增</button><button onclick="go('sold',this)">↗<br>已卖</button><button onclick="openCategory()">☷<br>分类</button></nav>

<div class="modal" id="editModal"><div class="dialog"><h2 id="modalTitle">新增资产</h2>
<form id="form" onsubmit="saveItem(event)"><div class="grid">
<div class="field"><label>分类</label><select id="category" onchange="toggleSlabCompany()"></select></div>
<div class="field" id="slabCompanyField"><label>鉴定公司</label><select id="slabCompany"></select></div>
<div class="field"><label>名称</label><input id="name" required></div>
<div class="field"><label>编号 / 版本</label><input id="code"></div>
<div class="field"><label>Grade</label><input id="grade" placeholder="PSA 10 / CGC 10 / Sealed"></div>
<div class="field"><label>PSA / 鉴定序列号</label><input id="serial"></div>
<div class="field"><label>收卡日期</label><input id="buyDate" type="date"></div>
<div class="field"><label>收卡价 (RM)</label><input id="buyPrice" type="number" step=".01" required></div>
<div class="field"><label>当前市值 (RM)</label><input id="market" type="number" step=".01"></div>
<div class="field"><label>卖出日期</label><input id="sellDate" type="date"></div>
<div class="field"><label>卖出价 (RM)</label><input id="sellPrice" type="number" step=".01"></div>
<div class="field"><label>手续费 (RM)</label><input id="fees" type="number" step=".01" value="0"></div>
<div class="field"><label>运费 / 其他成本 (RM)</label><input id="shipping" type="number" step=".01" value="0"></div>
<div class="field full"><label>图片</label><input id="image" type="file" accept="image/*" capture="environment" onchange="previewImage(this)"><img id="preview" class="preview" hidden></div>
<div class="field full"><label>备注</label><textarea id="note" rows="3"></textarea></div>
</div><div class="footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form>
</div></div>

<div class="modal" id="catModal"><div class="dialog"><h2>分类管理</h2><div id="catManage"></div><div style="display:flex;gap:8px;margin-top:15px"><input id="newCat" placeholder="例如 Booster Box"><button class="btn primary" onclick="addCategory()">＋ 新增</button></div><div class="footer"><button class="btn" onclick="closeCategory()">完成</button></div></div></div>
<input id="import" type="file" accept=".json" hidden onchange="importData(this)">

 $('holdingCount').textContent=hold.length+' 项';$('soldCount').textContent=sold.length+' 项';$('holdingBody').innerHTML=hold.map(rowHold).join('')||`<tr><td colspan="12" style="text-align:center;color:#778399;padding:35px">暂无资料</td></tr>`;$('soldBody').innerHTML=sold.map(rowSold).join('')||`<tr><td colspan="11" style="text-align:center;color:#778399;padding:35px">暂无资料</td></tr>`;
}
function rowHold(x){return `<tr><td>${x.image?`<img class="thumb" src="${esc(x.image)}">`:'—'}</td><td><b>${esc(x.name)}</b></td><td><span class="badge">${esc(x.category)}</span></td><td>${x.category==='SLAB'?esc(x.slabCompany||'PSA'):'—'}</td><td>${esc(x.code)}</td><td>${esc(x.grade||'—')}</td><td>${esc(x.serial||'—')}</td><td>${formatDate(x.buyDate)}</td><td><b>${money(x.buyPrice)}</b></td><td>${money(x.market)}</td><td>${days(x)}</td><td><div class="actions"><button onclick="editItem('${x.id}')">编辑</button><button onclick="sellItem('${x.id}')">卖出</button><button onclick="delItem('${x.id}')">删除</button></div></td></tr>`}
function rowSold(x){return `<tr><td>${x.image?`<img class="thumb" src="${esc(x.image)}">`:'—'}</td><td><b>${esc(x.name)}</b></td><td><span class="badge">${esc(x.category)}</span></td><td>${x.category==='SLAB'?esc(x.slabCompany||'PSA'):'—'}</td><td>${formatDate(x.buyDate)}</td><td>${money(x.buyPrice)}</td><td>${formatDate(x.sellDate)}</td><td>${money(x.sellPrice)}</td><td>${money(extra(x))}</td><td class="${net(x)>=0?'positive':'negative'}">${money(net(x))}</td><td><div class="actions"><button onclick="editItem('${x.id}')">编辑</button><button onclick="delItem('${x.id}')">删除</button></div></td></tr>`}
function formatDate(v){if(!v)return '—';let p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function renderSide(){$('catList').innerHTML=`<div class="catItem ${selectedCat==='all'?'active':''}" onclick="filterCat('all')"><span>全部分类</span><em>${items.length}</em></div>`+cats.map(c=>`<div class="catItem ${selectedCat===c?'active':''}" onclick="filterCat('${esc(c)}')"><span>${esc(c)}${c==='SLAB'?`<small style="display:block;color:#667389;font-size:9px">PSA · CGC · CCIC · TAG · BGS</small>`:''}</span><em>${items.filter(x=>x.category===c).length}</em></div>`).join('');$('sideSearch').value=query}
function filterCat(c){selectedCat=c;render()}
function syncSearch(v){query=v;render()}
function go(id,btn){$(id).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav button,.mobile-only-nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');$('sidebar').classList.remove('mobileOpen')}
function toggleMenu(){$('sidebar').classList.toggle('mobileOpen')}
function openAdd(){editId=null;imageData='';$('form').reset();$('modalTitle').textContent='新增资产';$('category').value=cats.includes('SLAB')?'SLAB':cats[0];$('slabCompany').value='PSA';toggleSlabCompany();$('preview').hidden=true;$('editModal').classList.add('show')}
function editItem(id){let x=items.find(a=>a.id==id);if(!x)return;editId=id;$('name').value=x.name;$('code').value=x.code||'';$('grade').value=x.grade||'';$('serial').value=x.serial||'';$('buyDate').value=x.buyDate||'';$('buyPrice').value=x.buyPrice||0;$('market').value=x.market||0;$('sellDate').value=x.sellDate||'';$('sellPrice').value=x.sellPrice??'';$('fees').value=x.fees||0;$('shipping').value=x.shipping||0;$('note').value=x.note||'';$('category').value=cats.includes(x.category)?x.category:'SLAB';$('slabCompany').value=x.slabCompany||'PSA';toggleSlabCompany();imageData=x.image||'';$('preview').src=imageData;$('preview').hidden=!imageData;$('modalTitle').textContent='编辑资产';$('editModal').classList.add('show')}
function sellItem(id){editItem(id);setTimeout(()=>{$('sellDate').value=new Date().toISOString().slice(0,10)},0)}
async function saveItem(e){
 e.preventDefault();if(!currentUser)return;
 let x={id:editId||crypto.randomUUID(),category:$('category').value,slabCompany:$('category').value==='SLAB'?$('slabCompany').value:'',name:$('name').value.trim(),code:$('code').value.trim(),grade:$('grade').value.trim(),serial:$('serial').value.trim(),buyDate:$('buyDate').value,buyPrice:Number($('buyPrice').value||0),market:Number($('market').value||0),sellDate:$('sellDate').value,sellPrice:$('sellPrice').value===''?null:Number($('sellPrice').value),fees:Number($('fees').value||0),shipping:Number($('shipping').value||0),note:$('note').value.trim(),image:imageData};
 let {error}=await sb.from('cards').upsert(toDb(x),{onConflict:'id'});if(error){alert('保存失败：'+error.message);return}
 if(editId)items=items.map(a=>a.id==editId?x:a);else items.unshift(x);save();closeModal();render()
}
function closeModal(){$('editModal').classList.remove('show')}
function previewImage(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let max=1200,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);imageData=c.toDataURL('image/jpeg',0.82);$('preview').src=imageData;$('preview').hidden=false};img.src=r.result};r.readAsDataURL(f)}
async function delItem(id){if(!confirm('确定删除这条资料？'))return;let {error}=await sb.from('cards').delete().eq('id',id);if(error){alert('删除失败：'+error.message);return}items=items.filter(x=>x.id!=id);save();render()}
function openCategory(){renderCatManage();$('catModal').classList.add('show')}
function closeCategory(){$('catModal').classList.remove('show')}
function renderCatManage(){$('catManage').innerHTML=cats.map(c=>{let n=items.filter(x=>x.category===c).length;return `<div style="display:flex;justify-content:space-between;align-items:center;background:#0c131d;border:1px solid #273447;border-radius:9px;padding:10px;margin:6px 0"><span><b>${esc(c)}</b> <small style="color:#778399">${n} 项</small></span>${n===0&&cats.length>1?`<button class="btn" onclick="deleteCat('${esc(c)}')">删除</button>`:''}</div>`}).join('')}
async function addCategory(){let n=$('newCat').value.trim();if(!n)return;if(cats.some(c=>c.toLowerCase()===n.toLowerCase()))return alert('分类已经存在');let {error}=await sb.from('categories').insert({name:n,sort_order:cats.length});if(error){alert('新增分类失败：'+error.message);return}cats.push(n);saveCats();$('newCat').value='';renderCatManage();render()}
async function deleteCat(c){if(items.some(x=>x.category===c))return alert('该分类还有资料，不能删除');let {error}=await sb.from('categories').delete().eq('name',c);if(error){alert('删除分类失败：'+error.message);return}cats=cats.filter(x=>x!==c);saveCats();renderCatManage();render()}
function exportData(){let data={version:14,exportedAt:new Date().toISOString(),categories:cats,items};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pokevault-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error('没有 items');for(const c of (d.categories||[])){if(!cats.includes(c))await sb.from('categories').insert({name:c,sort_order:cats.length})}for(const raw of d.items){let x={...raw,id:raw.id||crypto.randomUUID()};await sb.from('cards').upsert(toDb(x),{onConflict:'id'})}await loadCloud();alert('恢复成功')}catch(e){alert('备份文件格式不正确或云端恢复失败：'+e.message)}};r.readAsText(f)}
renderSlabCompanies();initAuth();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
